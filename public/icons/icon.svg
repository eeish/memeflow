<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256, 256)">
    <!-- Stylized C shape representing connection/cord -->
    <path d="M-60,-100 Q-120,-100 -120,0 Q-120,100 -60,100"
          fill="none" stroke="url(#accent)" stroke-width="32" stroke-linecap="round"/>
    <!-- Inner connection dot -->
    <circle cx="40" cy="0" r="24" fill="url(#accent)"/>
    <!-- Connection lines -->
    <line x1="-60" y1="-60" x2="40" y2="-20" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <line x1="-60" y1="60" x2="40" y2="20" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
