version: '3.8'

services:
  # Rust Backend Service
  memeflow-service:
    build:
      context: ./service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=sqlite:./data/memeflow.db
      - HOST=0.0.0.0
      - PORT=3001
      - RUST_LOG=info
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./service/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Frontend Development (optional - can run separately)
  # Uncomment if you want frontend in Docker too
  # memeflow-frontend:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.frontend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - .:/app
  #     - /app/node_modules
  #   environment:
  #     - VITE_API_BASE_URL=http://localhost:3001
  #   depends_on:
  #     - memeflow-service
  #   command: npm run dev -- --host 0.0.0.0

volumes:
  service_data:
    driver: local

networks:
  default:
    name: memeflow-network