[package]
name = "memeflow-service"
version = "0.1.0"
edition = "2021"
authors = ["MemeFlow Team"]
description = "Backend service for MemeFlow social trading platform"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
anyhow = "1.0"
env_logger = "0.10"
log = "0.4"

# Authentication & Crypto
jsonwebtoken = "9.0"
bcrypt = "0.15"

# HTTP client for external APIs
reqwest = { version = "0.11", features = ["json"] }

# Address validation and crypto utilities
regex = "1.10"
hex = "0.4"
ed25519-dalek = "2.1"
bech32 = "0.11"
